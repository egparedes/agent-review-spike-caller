name: Pin by SHA

on:
  workflow_dispatch:

permissions: {}

jobs:
  sha:
    uses: egparedes/agent-review-spike-central/.github/workflows/called-probe.yml@70910c4f287a076ad43805ba26239686f5801a27 # v0.4.0
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    with:
      variant: pin-sha

name: Probe

# Throwaway design spike. Calls the central probe in three ways:
#   by_sha     pinned by full SHA (commit C, not HEAD), explicit secrets
#   by_tag     pinned by tag v0.1.0 (also commit A), secrets: inherit
#   by_branch  @main (HEAD, commit B), no secrets
on:
  push:
    branches: [main, 'spike/**']
  workflow_dispatch:
  pull_request_target:
    types: [labeled]

permissions: {}

jobs:
  by_sha:
    if: github.event_name != 'pull_request_target' || github.event.label.name == 'probe'
    uses: egparedes/agent-review-spike-central/.github/workflows/called-probe.yml@70910c4f287a076ad43805ba26239686f5801a27 # v0.4.0
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    with:
      variant: by_sha
      pr: ${{ github.event.pull_request.number || vars.SPIKE_PR }}
      oidc: true
      write_job: true
    secrets:
      inference_api_key: ${{ secrets.AGENT_REVIEW_INFERENCE_API_KEY }}
      shared_mapped: ${{ secrets.SPIKE_SHARED }}

  by_tag:
    if: github.event_name != 'pull_request_target' || github.event.label.name == 'probe'
    uses: egparedes/agent-review-spike-central/.github/workflows/called-probe.yml@v0.4.0
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    with:
      variant: by_tag
    secrets: inherit

  by_branch:
    if: github.event_name != 'pull_request_target' || github.event.label.name == 'probe'
    uses: egparedes/agent-review-spike-central/.github/workflows/called-probe.yml@main
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    with:
      variant: by_branch

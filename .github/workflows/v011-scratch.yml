name: v0.1.1 scratch (TEMPORARY)

# TEMPORARY, dispatch-only: tests of GridTools/ci-workflows' branch
# 'fix/v0.1.1-validation-findings' (stalled-request timeouts, the message
# after an environment denial). Same environment and secret mapping as
# agent-review.yml; always a dry run. Remove after the tests.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string
      harness:
        description: Harness
        type: choice
        default: stub
        options: [stub, opencode, pi]
      upload_audit:
        description: Upload AWF's audit and proxy logs
        type: boolean
        default: false
      addendum:
        description: Prompt addendum path (a wrong one makes the review job fail before the sandbox)
        type: string
        default: .github/agent-review/prompt-addendum.md

permissions: {}

concurrency:
  group: v011-scratch-${{ inputs.pr }}
  cancel-in-progress: false

jobs:
  review:
    uses: GridTools/ci-workflows/.github/workflows/agent-review.yml@80a822afa1ebbe0c0d07582429cd0bdb7dbabbfa # fix/v0.1.1-validation-findings
    permissions:
      contents: read
      pull-requests: write
    with:
      harness: ${{ inputs.harness }}
      model: ${{ vars.AGENT_REVIEW_MODEL }}
      pr: ${{ inputs.pr }}
      dry_run: true
      upload_audit: ${{ inputs.upload_audit == true }}
      rule_files: |
        AGENTS.md
      prompt_addendum: ${{ inputs.addendum }}
    secrets:
      inference_api_key: ${{ secrets.AGENT_REVIEW_INFERENCE_API_KEY }}

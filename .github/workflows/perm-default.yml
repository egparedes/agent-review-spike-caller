name: Permissions default

# Throwaway spike: the calling job sets no 'permissions:' (repository default
# token permissions apply) and a called job asks for pull-requests: write.
on:
  workflow_dispatch:

jobs:
  default:
    uses: egparedes/agent-review-spike-central/.github/workflows/called-probe.yml@70910c4f287a076ad43805ba26239686f5801a27
    with:
      variant: default-perms
      pr: ${{ vars.SPIKE_PR }}
      write_job: true
